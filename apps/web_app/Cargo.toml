[package]
name = "waypoint_web"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["sqlcipher"]
sqlcipher = ["waypoint_workspace/sqlcipher"]

[dependencies]
getrandom = "0.4.3"
base64 = "0.23.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11.1"
subtle = "2"
zeroize = "1"
native-tls = "0.2.18"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "form", "query"] }
percent-encoding = "2"
quick-xml = "=0.42.0"
zip = { version = "=9.5.0", default-features = false, features = ["deflate"] }
serde_json = "1"
httparse = "1.10.1"
mio = { version = "1.2.4", features = ["net", "os-poll"] }
icu_calendar = { version = "=2.4.0", default-features = false }
icu_datetime = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
icu_locale_core = "=2.4.0"
tempfile = "3"
url = "2"
waypoint_domain = { path = "../../crates/waypoint_domain" }
waypoint_applications = { path = "../../crates/waypoint_applications" }
waypoint_browser = { path = "../../crates/waypoint_browser" }
waypoint_connectors = { path = "../../crates/waypoint_connectors" }
waypoint_inference = { path = "../../crates/waypoint_inference" }
waypoint_research = { path = "../../crates/waypoint_research" }
waypoint_policy = { path = "../../crates/waypoint_policy" }
waypoint_net = { path = "../../crates/waypoint_net" }
waypoint_store = { path = "../../crates/waypoint_store" }
waypoint_search = { path = "../../crates/waypoint_search" }
waypoint_workspace = { path = "../../crates/waypoint_workspace" }
webbrowser = "1.2"

[dev-dependencies]
rusqlite = { workspace = true }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
gpuviewer-core = { version = "=0.2.2", default-features = false, features = ["wddm"] }
sysinfo = { version = "=0.40.1", default-features = false, features = ["system"] }
tray-icon = { version = "=0.26.1", default-features = false }
winit = { version = "=0.30.13", default-features = false }
processkit = { version = "=3.3.4", default-features = false, features = ["limits", "process-control"] }
tokio = { version = "1", features = ["rt", "time", "process", "io-util"] }
