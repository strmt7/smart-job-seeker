<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Fictional mixed-material application</title>
<style>body{font:18px Arial;margin:24px;max-width:680px}fieldset{margin:18px 0;padding:14px}label{display:block;margin:12px 0 4px}input{display:block;font:inherit;padding:6px;width:390px;max-width:100%;box-sizing:border-box}button{font:inherit;margin:12px 0;padding:8px}pre{white-space:pre-wrap}</style></head><body>
<main id="application"><form onsubmit="event.preventDefault()">
<fieldset><legend>Your details</legend><label for="name">Full name</label><input id="name" autocomplete="name" required><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required></fieldset>
<fieldset><legend>Application documents</legend><label for="cv">Upload your resume</label><input id="cv" type="file" accept="application/pdf" required><label for="cover">Upload your cover letter</label><input id="cover" type="file" accept="application/pdf" required></fieldset>
<fieldset><legend>Current employment</legend><label for="employer">Current employer</label><input id="employer" required><label for="title">Current job title</label><input id="title" required><label for="start">Year you started your current role</label><input id="start" required maxlength="4"></fieldset>
<fieldset><legend>Technical experience</legend><label for="language">Which programming language have you used for test tooling? Language name only.</label><input id="language" required maxlength="32"><label for="years">Years of test tooling experience. Number only.</label><input id="years" type="number" min="0" max="50" step="1" required><label for="optional-pilot">Commercial pilot qualification (optional)</label><input id="optional-pilot"><label for="optional-drilling">Deep-sea drilling experience (optional)</label><input id="optional-drilling"></fieldset>
<button id="review" type="button">Review application</button></form></main>
<section id="final-review" hidden><h1>Review your application</h1><p>This fictional page has no delivery endpoint.</p><pre id="summary"></pre><button id="delivery-disabled" type="button" disabled>Submit application</button></section>
<script>document.getElementById('review').onclick=()=>{const form=document.querySelector('form');if(!form.reportValidity())return;const rows=Array.from(form.querySelectorAll('input')).map(input=>input.id+': '+(input.type==='file'?Array.from(input.files).map(f=>f.name).join(', '):input.value));document.getElementById('summary').textContent=rows.join('\n');document.getElementById('application').hidden=true;document.getElementById('final-review').hidden=false;};</script>
</body></html>
