<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fictional application fixture</title></head><body>
<form><label for="candidate">Given name</label><input id="candidate" name="candidate" value="Old value" required oninput="this.setAttribute('data-seen',this.value)"><label for="work-permit">Work authorization</label><input id="work-permit" name="work-permit" required oninput="this.setAttribute('data-seen',this.value)"><label>Email address<input id="email" type="email" oninput="this.setAttribute('data-seen',this.value)"></label><label for="country">Country</label><select id="country" onchange="this.setAttribute('data-seen',this.value)"><option value="">Choose</option><option value="de">Germany</option><option value="fr">France</option></select><label for="available">Available start date</label><input id="available" type="date" min="2025-01-01" max="2035-12-31" onchange="this.setAttribute('data-seen',this.value)"><label for="travel">Available for travel</label><input id="travel" type="checkbox" checked onchange="this.setAttribute('data-seen',String(this.checked))"><fieldset><legend>Preferred working arrangement</legend><label for="onsite">On-site</label><input type="radio" id="onsite" name="arrangement" value="onsite" checked><label for="remote">Remote</label><input type="radio" id="remote" name="arrangement" value="remote" onchange="this.setAttribute('data-seen',String(this.checked))"></fieldset><label>CV<input id="resume" type="file" onchange="this.setAttribute('data-attached',this.files[0]?.name || '')"></label><label for="clear-attachment">Clear attachment fixture</label><input id="clear-attachment" oninput="document.querySelector('#resume').value=''"><label for="later-answer">Later answer</label><input id="later-answer" oninput="document.querySelector('#candidate').value='';document.querySelector('#resume').value=''"><button type="submit">Submit</button></form>
<label for="skills">Skills</label><select id="skills" multiple onchange="this.setAttribute('data-seen',Array.from(this.selectedOptions,option=>option.value).join(','))"><option value="rust">Rust</option><option value="python">Python</option><option value="go">Go</option></select>
<div style="height:2600px" aria-hidden="true"></div></body></html>
