<!doctype html><html lang="en"><body><form>
<label>Name<input id="name" type="text"></label>
<label>Email<input id="email" type="email"></label>
<label>Code<input id="code" type="text" pattern="[A-Z]{2}"></label>
<label>Start date<input id="date" type="date" min="2026-01-01" max="2026-12-31"></label>
<label>Time<input id="time" type="time" min="09:00" max="17:00" step="3600"></label>
<button type="submit">Submit</button>
</form></body></html>
