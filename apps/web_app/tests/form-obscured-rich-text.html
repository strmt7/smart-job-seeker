<!doctype html><html><body><form>
<div style="position:relative;width:300px;height:50px">
  <div id="covered" role="textbox" aria-label="Covered answer" contenteditable="true" style="width:300px;height:50px"></div>
  <div style="position:absolute;inset:0;background:white">Overlay</div>
</div>
<div style="position:relative;width:300px;height:50px">
  <div id="focus-covered" role="textbox" aria-label="Focus answer" contenteditable="true" style="width:300px;height:50px" onfocus="document.getElementById('focus-overlay').hidden=false"></div>
  <div id="focus-overlay" hidden style="position:absolute;inset:0;background:white">Overlay</div>
</div>
<div id="clear" role="textbox" aria-label="Visible answer" contenteditable="true" style="width:300px;height:50px"></div>
</form></body></html>
