[package]
name = "waypoint_workspace"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
sqlcipher = ["waypoint_store/sqlcipher", "dep:getrandom", "dep:zeroize"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
getrandom = { version = "0.3", optional = true }
zeroize = { version = "1", optional = true }
waypoint_applications = { path = "../waypoint_applications" }
waypoint_connectors = { path = "../waypoint_connectors" }
waypoint_domain = { path = "../waypoint_domain" }
waypoint_inference = { path = "../waypoint_inference" }
waypoint_materials = { path = "../waypoint_materials" }
waypoint_net = { path = "../waypoint_net" }
waypoint_policy = { path = "../waypoint_policy" }
waypoint_search = { path = "../waypoint_search" }
waypoint_seal = { path = "../waypoint_seal" }
waypoint_store = { path = "../waypoint_store" }

[lints]
workspace = true
