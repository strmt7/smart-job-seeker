<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fictional form</title></head><body>
<form>
<div role="radiogroup" aria-label="Work arrangement" aria-required="true">
  <div role="radio" aria-checked="false" tabindex="0">On site</div>
  <div role="radio" aria-checked="true" aria-disabled="true" tabindex="-1">Remote</div>
</div>
<div role="radiogroup" aria-label="Native schedule" aria-required="true">
  <label><input type="radio" name="schedule">Day</label>
  <label><input type="radio" name="schedule">Evening</label>
</div>
<div role="radiogroup" aria-label="Hidden group" aria-required="true" hidden><div role="radio">Hidden</div></div>
<button type="submit">Submit</button>
</form></body></html>
