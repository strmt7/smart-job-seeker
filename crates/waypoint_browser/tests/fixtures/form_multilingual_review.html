<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Fictional multilingual form</title></head>
<body><form>
  <label for="first">Vorname</label><input id="first" autocomplete="given-name">
  <label for="email">E-Mail-Adresse</label><input id="email" type="email" autocomplete="email">
  <label for="permit">Besitzen Sie eine Arbeitserlaubnis?</label><input id="permit">
  <label for="gender">Geschlecht</label><input id="gender">
  <label for="salary">Gehaltsvorstellung</label><input id="salary">
  <label for="sponsor">¿Necesita patrocinio laboral?</label><input id="sponsor">
  <label for="birth">Date de naissance</label><input id="birth">
</form></body></html>
