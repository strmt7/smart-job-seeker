<!doctype html><html><body>
<x-decoration></x-decoration><x-decoration></x-decoration><x-decoration></x-decoration><x-decoration></x-decoration><x-decoration></x-decoration>
<x-application id="open-host" style="display:block"></x-application>
<x-private id="closed-host" style="display:block"></x-private>
<button id="replace-host" type="button" onclick="document.getElementById('open-host').replaceWith(document.createElement('x-replacement'))">Replace</button>
<button id="hide-hosts" type="button" onclick="document.getElementById('closed-host').style.display='none';document.querySelector('x-application')?.remove()">Hide</button>
<script>
for (const host of document.querySelectorAll('x-decoration')) { host.style.display='block'; host.attachShadow({mode:'open'}).innerHTML='<span>Decoration</span>'; }
const openRoot = document.getElementById('open-host').attachShadow({mode:'open'});
openRoot.innerHTML = `<label>Name <input name="candidate" autocomplete="given-name"></label><label>Place <select name="place"><option>Choose</option><option>Remote</option></select></label><label>Updates <input name="updates" type="checkbox"></label><fieldset><legend>Schedule</legend><label><input type="radio" name="schedule" value="full">Full time</label><label><input type="radio" name="schedule" value="part">Part time</label></fieldset><label>Attachment <input type="file" name="attachment" accept=".pdf"></label>`;
const closedRoot = document.getElementById('closed-host').attachShadow({mode:'closed'});
closedRoot.innerHTML = `<label>Private question <input name="private"></label>`;
</script>
</body></html>
