<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fictional grouped questions</title></head><body>
<form><fieldset><legend>Application questions</legend>
<div><p>Which travel schedule works for you?</p><div><label><input type="radio" name="travel" value="daily" required>Daily</label><label><input type="radio" name="travel" value="weekly" required>Weekly</label></div></div>
<div><p>Which office would you choose?</p><div><label><input type="radio" name="office" value="north">North</label><label><input type="radio" name="office" value="south">South</label></div></div>
<div><p>First possible question</p><p>Second possible question</p><label><input type="radio" name="ambiguous" value="yes">Yes</label><label><input type="radio" name="ambiguous" value="no">No</label></div>
<div><p hidden>Hidden misleading question</p><label><input type="radio" name="hidden" value="yes">Yes</label><label><input type="radio" name="hidden" value="no">No</label></div>
<fieldset><legend>Preferred colour</legend><label><input type="radio" name="colour" value="blue">Blue</label><label><input type="radio" name="colour" value="green">Green</label></fieldset>
</fieldset><output>NOT SUBMITTED</output></form></body></html>
