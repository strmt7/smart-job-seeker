<!doctype html><html><body><form>
<div id="answer" contenteditable="true" role="textbox" aria-label="Motivation" aria-required="true"><p>Previous answer</p></div>
<div id="unsafe" contenteditable="true" role="textbox" aria-label="Unsafe editor"><input value="nested"></div>
<div id="disabled" contenteditable="true" role="textbox" aria-label="Disabled editor" aria-disabled="true">Original</div>
<div id="unlabelled" contenteditable="true" role="textbox">Unknown content</div>
<button id="mode" type="button" onclick="document.getElementById('answer').setAttribute('contenteditable','plaintext-only')">Change editor mode</button>
<button type="submit">Submit</button>
</form></body></html>
