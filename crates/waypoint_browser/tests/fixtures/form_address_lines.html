<!doctype html><html lang="en"><head><style>body{font:22px Arial,sans-serif;margin:36px}label{display:block;margin-top:14px}input{font:20px Arial,sans-serif;width:360px}</style></head><body><form onsubmit="document.getElementById('status').textContent='SUBMITTED';return false">

</form></body></html>
