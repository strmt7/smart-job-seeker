<!doctype html><html><body><form>
<label for="visible">Visible</label><input id="visible" value="Example">
<label for="hidden">Hidden</label><input id="hidden" value="Example" style="display:none">
<div style="opacity:0"><label for="transparent">Transparent</label><input id="transparent" value="Example"></div>
<div style="visibility:hidden"><label for="invisible">Invisible</label><input id="invisible" value="Example"></div>
<label for="offscreen">Offscreen</label><input id="offscreen" value="Example" style="position:absolute;top:4000px">
</form></body></html>
