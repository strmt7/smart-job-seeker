<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fictional radio action</title></head><body>
<form><span id="work-question">Working arrangement</span><div role="radiogroup" aria-labelledby="work-question">
<div id="onsite" role="radio" aria-checked="false" tabindex="0" onclick="this.setAttribute('aria-checked','true')">On site</div>
<div id="remote" role="radio" aria-checked="false" tabindex="0" onclick="this.setAttribute('aria-checked','true')">Remote</div>
</div><div role="radiogroup" aria-label="Danger"><button type="submit" role="radio" aria-checked="false">Send application</button></div>
<div role="radiogroup" aria-label="Changes on hover"><div id="changing" role="radio" aria-checked="false" onmouseover="this.setAttribute('role','button')" onclick="this.setAttribute('data-clicked','yes')">Changing</div></div>
<button type="submit">Submit</button></form></body></html>
