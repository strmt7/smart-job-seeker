<!doctype html>
<html lang="en"><body><form>
<label>Years of experience <input id="years" type="number" min="1" max="9" step="2" value="3"></label>
<label>Changing range <input id="changing" type="number" min="1" max="9" value="3" onfocus="this.min='7'"></label>
<button type="button" id="change-max" onclick="document.getElementById('years').max='10'">Change maximum</button>
</form></body></html>
