[package]
name = "waypoint_browser"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
waypoint_applications = { path = "../waypoint_applications" }
waypoint_domain = { path = "../waypoint_domain" }
waypoint_net = { path = "../waypoint_net" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
url = "2"
tungstenite = "0.30"

[target.'cfg(windows)'.dependencies]
processkit = { version = "=3.3.4", default-features = false, features = ["process-control", "limits"] }
tokio = { version = "1", features = ["rt", "time", "process", "io-util"] }
tokio-stream = "=0.1.19"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
waypoint_workspace = { path = "../waypoint_workspace" }
waypoint_store = { path = "../waypoint_store" }
