name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Web review and build-helper checks
        shell: pwsh
        run: |
          node --check apps/web_app/web/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node apps/web_app/tests/visual-review-ui.test.js
          node apps/web_app/tests/letter-export-recovery-ui.test.js
          node apps/web_app/tests/visual-dense-retry-ui.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node apps/web_app/tests/search-coverage-ui.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node apps/web_app/tests/single-search-recovery-ui.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node apps/web_app/tests/search-plan-recovery-ui.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node apps/web_app/tests/search-plan-binding-ui.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./apps/web_app/scripts/test-build-paths.ps1
          ./apps/web_app/scripts/test-install-package.ps1
          python ./apps/web_app/scripts/test-package-windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Configure OpenSSL for SQLCipher
        shell: pwsh
        run: |
          $openssl = Join-Path $env:ProgramFiles 'OpenSSL'
          $libs = Join-Path $openssl 'lib\VC\x64\MD'
          $includes = Join-Path $openssl 'include'
          if (!(Test-Path (Join-Path $includes 'openssl\crypto.h')) -or !(Test-Path (Join-Path $libs 'libcrypto.lib'))) {
            throw 'The Windows runner OpenSSL headers or x64 MSVC libraries are unavailable.'
          }
          "OPENSSL_DIR=$openssl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_INCLUDE_DIR=$includes" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_LIB_DIR=$libs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIB=$libs;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $openssl 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (zero warnings required)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Release build
        run: cargo build --release -p windows_app

  # The submission engine is only meaningful if it works against a real
  # browser, so the ignored CDP tests run here against the runner's own
  # Chromium-family install. Local fixture pages only: no third-party site is
  # ever contacted by these tests.
  browser-e2e:
    runs-on: windows-latest
    env:
      WAYPOINT_BROWSER_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Real-browser submission tests
        run: cargo test -p waypoint_browser --test cdp_live -- --ignored --test-threads=1

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Security audit (deny warnings except the documented unmaintained notice)
        # RUSTSEC-2026-0192: ttf-parser 0.25.1 unmaintained, transitive via egui,
        # no CVE, no safe upgrade; tracked in KNOWN_LIMITATIONS.md item 9.
        run: cargo audit --deny warnings --ignore RUSTSEC-2026-0192
      - name: License/ban/source policy
        run: cargo deny check licenses bans sources
