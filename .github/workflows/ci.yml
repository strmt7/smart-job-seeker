name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  agent-tool-contracts:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check isolated agent-tool boundaries
        run: python -B -m unittest discover -s tools/tests -v
      - name: Check isolated-browser protocol and verified copies
        run: python -B crates/waypoint_browser/tests/test_rehearsal_worker.py -v
      - name: Check recorded-response replay and continuous interception
        run: python -B crates/waypoint_browser/tests/test_rehearsal_replay.py -v

  pdf-stream-regression:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Install pinned PDF dependencies
        run: |
          python -m pip install --only-binary=:all: pypdf==7.0.0 pypdfium2==5.15.0 Pillow==13.0.0
      - name: Check fictional PDF Unicode mapping
        run: python -B apps/web_app/tests/pdf-stream-charmap.test.py
      - name: Check fictional PDF passage selection
        run: python -B apps/web_app/tests/pdf-edit-selection.test.py
      - name: Check fictional PDF page limits
        run: python -B apps/web_app/tests/pdf-page-limit.test.py
      - name: Check PDF text-review modes and image coverage
        run: python -B apps/web_app/tests/pdf-text-mode.test.py

  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Web review and build-helper checks
        shell: pwsh
        run: |
          node --check apps/web_app/web/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uiTests = @(Get-ChildItem apps/web_app/tests -Filter '*-ui.test.js' | Sort-Object Name)
          if ($uiTests.Count -eq 0) { throw 'No UI tests found' }
          foreach ($test in $uiTests) {
            Write-Host "Running $($test.Name)"
            node $test.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ./apps/web_app/scripts/test-grade-local-evaluation.ps1
          ./apps/web_app/scripts/test-build-paths.ps1
          ./apps/web_app/scripts/test-install-package.ps1
          python ./apps/web_app/scripts/test-package-windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ./apps/web_app/scripts/test-runtime-setup.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: '1.99.1'
          components: clippy, rustfmt
      - name: Configure OpenSSL for SQLCipher
        shell: pwsh
        run: |
          # Cargo/cache cleanup owns target; keep native SDKs outside it.
          $dependencyRoot = Join-Path $env:RUNNER_TEMP 'smart-jobseeker-build-dependencies'
          New-Item -ItemType Directory -Path $dependencyRoot -Force | Out-Null
          $openssl = & ./apps/web_app/scripts/provision-openssl.ps1 -TargetRoot $dependencyRoot
          $libs = Join-Path $openssl 'lib'
          $includes = Join-Path $openssl 'include'
          "OPENSSL_DIR=$openssl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_INCLUDE_DIR=$includes" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_LIB_DIR=$libs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIB=$libs;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $openssl 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check locked dependency license inventory
        run: |
          python tools/verify_sqlite_vendor.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python apps/web_app/tests/license-inventory.test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python apps/web_app/scripts/update-license-inventory.py --check
      - name: Clippy (zero warnings required)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Release build
        run: ./apps/web_app/scripts/build-windows.ps1 -Release
      - name: Check headless resizing, browser zoom and pane dragging
        shell: pwsh
        run: |
          npm install --prefix target/layout-qa --no-save --ignore-scripts playwright-core@1.65.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node apps/web_app/scripts/qualify-layout.cjs --executable target/release/waypoint_web.exe
      - name: Retain layout observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-layout-observations
          path: target/layout-matrix-*/results.json
          if-no-files-found: warn

  # The submission engine is only meaningful if it works against a real
  # browser, so the ignored CDP tests run here against the runner's own
  # Chromium-family install. Local fixture pages only: no third-party site is
  # ever contacted by these tests.
  browser-e2e:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      WAYPOINT_BROWSER_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Real-browser submission tests
        # These two opt-in probes require a separately reviewed public URL.
        # The CI job exercises local fixtures only. The separate scripted-submit
        # diagnostic demonstrates an open bug and is not a passing safety test.
        run: cargo test -p waypoint_browser --test cdp_live -- --ignored --test-threads=1 --skip public_listing_navigation_probe --skip identified_public_navigation_probe --skip generic_click_can_trigger_scripted_form_submission_on_loopback --skip inert_private_form_structure_qualification
      - name: Retain browser qualification observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-qualification-observations
          path: target/browser-qualification/*.json
          if-no-files-found: warn

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: '1.99.1'
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Security audit (deny warnings)
        run: cargo audit --deny warnings
      - name: License/ban/source policy
        run: cargo deny check licenses bans sources
