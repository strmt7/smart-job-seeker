name: coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-coverage:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Configure OpenSSL for SQLCipher
        shell: pwsh
        run: |
          $openssl = Join-Path $env:ProgramFiles 'OpenSSL'
          $libs = Join-Path $openssl 'lib\VC\x64\MD'
          $includes = Join-Path $openssl 'include'
          if (!(Test-Path (Join-Path $includes 'openssl\crypto.h')) -or !(Test-Path (Join-Path $libs 'libcrypto.lib'))) {
            throw 'The Windows runner OpenSSL headers or x64 MSVC libraries are unavailable.'
          }
          "OPENSSL_DIR=$openssl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_INCLUDE_DIR=$includes" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_LIB_DIR=$libs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIB=$libs;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $openssl 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install coverage collector
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Measure Rust workspace tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force coverage | Out-Null
          cargo llvm-cov --workspace --lcov --output-path coverage/waypoint.lcov
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path coverage/waypoint.lcov) -or (Get-Item coverage/waypoint.lcov).Length -eq 0) {
            throw 'Coverage report was not created.'
          }
      - name: Upload measured coverage
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          cleanup: true
          files: coverage/waypoint.lcov
          flags: rust_workspace
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
          version: v11.3.1
      - name: Retain coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-workspace-coverage
          path: coverage/waypoint.lcov
          if-no-files-found: error
          retention-days: 7
