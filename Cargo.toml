[workspace]
members = [
  "crates/smart_job_core",
  "crates/waypoint_domain",
  "crates/waypoint_policy",
  "crates/waypoint_desktop",
  "crates/waypoint_inference",
  "crates/waypoint_store",
  "crates/waypoint_search",
  "crates/waypoint_seal",
  "crates/waypoint_research",
  "crates/waypoint_connectors",
  "crates/waypoint_net",
  "crates/waypoint_workspace",
  "crates/waypoint_materials",
  "crates/waypoint_applications",
  "crates/waypoint_browser",
  "crates/waypoint_lifecycle",
  "apps/windows_app",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.lints.rust]
# Denied everywhere, with exactly one visible exception: the DPAPI FFI in
# `waypoint_seal`, which carries a scoped #[allow(unsafe_code)] and a comment.
# `deny` (not `forbid`) is what makes a single reviewed exception possible while
# still failing the build on any other unsafe code.
unsafe_code = "deny"
