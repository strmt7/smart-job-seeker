[workspace]
members = [
  "crates/smart_job_core",
  "crates/waypoint_domain",
  "crates/waypoint_policy",
  "crates/waypoint_desktop",
  "crates/waypoint_inference",
  "crates/waypoint_store",
  "crates/waypoint_search",
  "crates/waypoint_research",
  "crates/waypoint_connectors",
  "crates/waypoint_materials",
  "crates/waypoint_applications",
  "crates/waypoint_lifecycle",
  "apps/windows_app",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
