# cargo-deny configuration for the Waypoint workspace.
# T046: licenses must be permissive (MIT/Apache-2.0/BSD/ISC/Unicode-3.0 etc.);
# copyleft (GPL/AGPL) is banned from the dependency graph because the product
# is MIT and must remain freely reusable.

[graph]
# fail on any target, not just the host
all-features = true

[licenses]
version = 2
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "0BSD",
  "BSL-1.0",
  "MPL-2.0",
  # egui's epaint_default_fonts bundles its font files under these; both are
  # OSI- and FSF-recognized free font licenses with redistribution rights.
  "OFL-1.1",
  "Ubuntu-font-1.0",
]
# MPL-2.0 is file-level copyleft; allowed for linked deps but flagged in review.

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
deny = []

[sources]
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unknown-git = "deny"
