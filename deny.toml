# cargo-deny configuration for the Waypoint workspace.
# T046: licenses must be permissive (MIT/Apache-2.0/BSD/ISC/Unicode-3.0 etc.);
# copyleft (GPL/AGPL) is banned from the dependency graph because the product
# is MIT and must remain freely reusable.

[graph]
# fail on any target, not just the host
all-features = true

[licenses]
version = 2
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "0BSD",
  "BSL-1.0",
  "MPL-2.0",
]
# MPL-2.0 is file-level copyleft; allowed for linked deps but flagged in review.

# Certificate data from the Common CA Database, distributed with its CDLA text.
# Keep these exceptions pinned to the reviewed crates and versions.
[[licenses.exceptions]]
name = "webpki-roots"
version = "=1.0.11"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
name = "webpki-root-certs"
version = "=1.0.11"
allow = ["CDLA-Permissive-2.0"]

# Reviewed archive fd6b5280...: MIT wrapper, BSD SQLCipher, SQLite's public-
# domain notice, and dual public-domain/WTFPL LibTomCrypt sources. Preserve
# the complete upstream expression and ship all component notices.
[[licenses.exceptions]]
name = "sqlcipher-src"
version = "=420.0.0"
allow = ["MIT", "BSD-3-Clause", "blessing", "WTFPL"]

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
deny = []

[sources]
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unknown-git = "deny"
